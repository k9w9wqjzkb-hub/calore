<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Ripartizione</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modals.css">

<link rel="apple-touch-icon" href="icons/caloriferi-512.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caloriferi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>

<!-- ================= TOPBAR ================= -->

<header class="app-header">

    <div class="app-title">
        <span>🔥</span>
        <span>Calore</span>
    </div>

    <nav class="nav-icons">

    <a href="index.html" title="Dashboard">
        <i data-lucide="house"></i>
    </a>

    <a href="caloriferi.html" title="Caloriferi">
        <i data-lucide="flame"></i>
    </a>

    <a href="storico.html" title="Storico">
        <i data-lucide="history"></i>
    </a>

    <a href="grafici.html" title="Grafici">
        <i data-lucide="chart-column"></i>
    </a>

    <a href="ripartizione.html" class="active" title="Ripartizione">
        <i data-lucide="file-text"></i>
    </a>

    <a href="impostazioni.html" title="Impostazioni">
        <i data-lucide="settings"></i>
    </a>

</nav>

</header>

<!-- ================= CONTENUTO ================= -->

<section class="container">

    <div class="page-header">

    <div class="page-heading">

        <h1 class="page-title">
            <i data-lucide="file-text"></i>
            <span>Ripartizione</span>
        </h1>

        <p class="page-subtitle">
            Unità contabilizzate
        </p>

    </div>

</div>

</section>

    <!-- ================= ANNO TERMICO ================= -->

    <div class="card rip-anno-card">

        <h3>📋 Anno termico</h3>

        <div class="row">
            <span class="label">Anno contabilizzazione</span>
            <span class="value" id="annoTermicoAttivo">--</span>
        </div>

        <div class="row">
            <span class="label">Ultimo aggiornamento</span>
            <span class="value" id="ultimoAggiornamento">--</span>
        </div>

    </div>

    <!-- ================= ELENCO ================= -->

    <div id="ripartizioneContainer"></div>

<!-- ================= TOTALE ================= -->

<div class="card rip-card-total">

    <div class="card-top">

        <span>🔥 Totale unità contabilizzate</span>

        <span
            class="big-number"
            id="totaleUnita">
            0
        </span>

    </div>

</div>

<!-- ================= OVERLAY ================= -->

<div
    id="sheetOverlayRipartizione"
    class="sheet-overlay hidden">
</div>

<!-- ================= MODALE ================= -->

<div
    id="sheetRipartizione"
    class="sheet hidden">

    <div class="sheet-header">

        <h2>Modifica fattore</h2>

        <button
            class="close-btn"
            onclick="chiudiRipartizioneSheet()">
            ✕
        </button>

    </div>

    <div class="sheet-content">

        <label>Locale</label>

        <input
            type="text"
            id="ripartizioneLocale"
            readonly>

        <label>Fattore</label>

        <input
            type="number"
            step="0.01"
            id="ripartizioneFattore">

        <button
            class="btn-pill full"
            onclick="salvaFattoreRipartizione()">

            Salva

        </button>

    </div>

</div>

<!-- ================= SCRIPT ================= -->

<script src="js/theme.js"></script> 
<script src="js/version.js"></script>
<script src="js/app.js"></script>
<script src="js/ripartizione.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>


<script>
window.addEventListener("load", () => {

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker attivo su:', reg.scope))
            .catch(err => console.error('Errore SW:', err));
    }

});
</script>

</body>
</html>
