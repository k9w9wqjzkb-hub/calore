<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- 🔑 QUESTO È FONDAMENTALE -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grafici Consumi</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modals.css">

<link rel="apple-touch-icon" href="icons/caloriferi-512.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caloriferi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>

<header class="app-header">

    <div class="app-title">
        <span>🔥</span>
        <span>Calore</span>
    </div>

    <nav class="nav-icons">

        <a href="index.html" title="Dashboard">
            <i data-lucide="house"></i>
        </a>

        <a href="caloriferi.html" title="Caloriferi">
            <i data-lucide="flame"></i>
        </a>

        <a href="storico.html" title="Storico">
            <i data-lucide="history"></i>
        </a>

        <a href="grafici.html" class="active" title="Grafici">
            <i data-lucide="chart-column"></i>
        </a>

        <a href="ripartizione.html" title="Ripartizione">
            <i data-lucide="file-text"></i>
        </a>

        <a href="impostazioni.html" title="Impostazioni">
            <i data-lucide="settings"></i>
        </a>

    </nav>

</header>

<main class="container">
  <div class="page-header">

    <div class="page-heading">

        <h1 class="page-title">
            <i data-lucide="chart-column"></i>
            <span>Grafici</span>
        </h1>

        <p class="page-subtitle">
            Analizza l'andamento dei consumi
        </p>

    </div>

</div>

  <div class="filter">
    <label for="filtroAnno">Seleziona anno:</label>
    <select id="filtroAnno"></select>
  </div>

  <div class="card chart-card">
    <h3>Consumi per Anno Termico (ultimi 5 anni)</h3>
    <canvas id="chartAnno"></canvas>
  </div>

  <div class="chart-card">
    <h3>Consumi per Stanza (Anno selezionato)</h3>
    <canvas id="chartStanza"></canvas>
  </div>
</main>

<!-- JS -->
<script src="js/theme.js"></script>
<script src="js/version.js"></script>
<script src="js/app.js"></script>
<script src="js/grafici.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker attivo su:', reg.scope))
        .catch(err => console.log('Errore SW:', err));
    });
  }
</script>
