<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Storico Letture</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modals.css">

</head>

<body>

<!-- TOPBAR FISSA -->
<header class="app-header">

    <div class="app-title">
        <span>🔥</span>
        <span>Calore</span>
    </div>

    <nav class="nav-icons">

    <a href="index.html" title="Dashboard">
        <i data-lucide="house"></i>
    </a>

    <a href="caloriferi.html" title="Caloriferi">
        <i data-lucide="flame"></i>
    </a>

    <a href="storico.html" class="active" title="Storico">
        <i data-lucide="history"></i>
    </a>

    <a href="grafici.html" title="Grafici">
        <i data-lucide="chart-column"></i>
    </a>

    <a href="ripartizione.html" title="Ripartizione">
        <i data-lucide="file-text"></i>
    </a>

    <a href="impostazioni.html" title="Impostazioni">
        <i data-lucide="settings"></i>
    </a>

</nav>

</header>

<main class="container">

  <section class="page-header">

    <h1>Storico letture</h1>

    <p>Consulta e gestisci lo storico delle letture</p>

</section>

    <div class="filter">
      <select id="filtroCalorifero">
      <option value="">Tutti i caloriferi</option>
      </select>
    </div>

    <div class="storico-wrapper">
      <div class="list-header">
      <div>Data</div>
      <div>Stanza</div>
      <div class="value-col">Valore</div>
      <div>Azioni</div>
    </div>
      <div class="list-card"></div>
    </div>

</main>

<!-- MODALE MODIFICA LETTURA -->
<div id="modalModificaLettura" class="modal hidden">
  <div class="modal-content">
    <h3>✏️ Modifica Lettura</h3>
    <label>Data</label>
    <input type="date" id="editData">
    <label>Stanza</label>
    <select id="editStanza"></select>
    <label>Valore</label>
    <input type="number" id="editValore">
    <div class="modal-actions">
      <button class="secondary" onclick="chiudiModificaLettura()">Annulla</button>
      <button class="primary" onclick="salvaModificaLettura()">Salva</button>
    </div>
  </div>
</div>

<!-- OVERLAY CONFERMA -->
<div id="overlayConferma" class="sheet-overlay hidden"></div>

<!-- MODALE CONFERMA -->
<div id="modalConferma" class="modal hidden">
  <div class="modal-content">

    <h3 id="titoloConferma"></h3>

    <div id="testoConferma"></div>

    <div class="modal-actions">
      <button class="secondary" onclick="chiudiConferma()">
        Annulla
      </button>

      <button id="btnConferma" class="primary">
        Elimina
      </button>
    </div>

  </div>
</div>

<script src="js/version.js"></script>
<script src="js/app.js"></script>
<script src="js/storico.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>

</body>
</html>
