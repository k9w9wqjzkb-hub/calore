<!DOCTYPE html>
<html lang="it">
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Calore 2.0 - Storico</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modals.css">

<link rel="apple-touch-icon" href="icons/caloriferi-512.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caloriferi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>

<!-- TOPBAR FISSA -->
<header class="app-header">

    <div class="app-title">
        <span>🔥</span>
        <span>Calore</span>
    </div>

    <nav class="nav-icons">

    <a href="index.html" title="Dashboard">
        <i data-lucide="house"></i>
    </a>

    <a href="caloriferi.html" title="Caloriferi">
        <i data-lucide="flame"></i>
    </a>

    <a href="storico.html" class="active" title="Storico">
        <i data-lucide="history"></i>
    </a>

    <a href="grafici.html" title="Grafici">
        <i data-lucide="chart-column"></i>
    </a>

    <a href="ripartizione.html" title="Ripartizione">
        <i data-lucide="file-text"></i>
    </a>

    <a href="impostazioni.html" title="Impostazioni">
        <i data-lucide="settings"></i>
    </a>

</nav>

</header>

<main class="container">

<section class="page-header">

    <div class="page-heading">

        <h1 class="page-title">
            <i data-lucide="history"></i>
            <span>Storico letture</span>
        </h1>

        <p class="page-subtitle">
            Consulta e gestisci lo storico delle letture
        </p>

    </div>

</section>

    <!-- FILTRI -->

<div class="filters-grid">

    <!-- ANNO TERMICO -->

    <div class="card filter-card">

        <div class="filter-icon">
            <i data-lucide="calendar-days"></i>
        </div>

        <div class="filter-content">

            <label for="filtroAnno">
                Anno termico
            </label>

            <select id="filtroAnno">

                <option value="">
                    Anno corrente
                </option>

            </select>

        </div>

    </div>

    <!-- STANZA -->

    <div class="card filter-card">

        <div class="filter-icon">
            <i data-lucide="house"></i>
        </div>

        <div class="filter-content">

            <label for="filtroStanza">
                Stanza
            </label>

            <select id="filtroStanza">

                <option value="">
                    Tutte le stanze
                </option>

            </select>

        </div>

    </div>

</div>

    <div class="storico-wrapper">
      <div class="list-header">
      <div>Data</div>
      <div>Stanza</div>
      <div class="value-col">Valore</div>
      
    </div>
      <div class="list-card"></div>
    </div>

</main>

<!-- OVERLAY MODIFICA LETTURA -->
<div
    id="modificaLetturaOverlay"
    class="sheet-overlay hidden">
</div>

<!-- SHEET MODIFICA LETTURA -->
<div id="modalModificaLettura" class="sheet hidden">

    <div class="sheet-header">

        <h2>
            <i data-lucide="pencil"></i>
            Modifica Lettura
        </h2>

        <button
            class="close-btn"
            onclick="chiudiModificaLettura()">

            ✕

        </button>

    </div>

    <div class="sheet-content">

        <label for="editData">
            Data
        </label>

        <input
            type="date"
            id="editData">

        <label for="editStanza">
            Stanza
        </label>

        <select id="editStanza"></select>

        <label for="editValore">
            Valore
        </label>

        <input
            type="number"
            id="editValore"
            inputmode="decimal">

        <div class="modal-actions">

            <button
                class="btn-modal-secondary"
                onclick="chiudiModificaLettura()">

                Annulla

            </button>

            <button
                class="btn-modal-primary"
                onclick="salvaModificaLettura()">

                Salva

            </button>

        </div>

    </div>

</div>

<!-- OVERLAY CONFERMA -->
<div id="overlayConferma" class="sheet-overlay hidden"></div>

<!-- MODALE CONFERMA -->
<div id="modalConferma" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h3 id="titoloConferma"></h3>

        </div>

        <div class="modal-body">

            <div id="testoConferma"></div>

        </div>

        <div class="modal-actions">

            <button
                class="btn-modal-secondary"
                onclick="chiudiConferma()">

                Annulla

            </button>

            <button
                id="btnConferma"
                class="btn-modal-primary">

                Elimina

            </button>

        </div>

    </div>

</div>

<!-- JS -->
<script src="js/theme.js"></script>
<script src="js/version.js"></script>
<script src="js/app.js"></script>
<script src="js/storico.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>

<script>
window.addEventListener("load", () => {

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker attivo su:', reg.scope))
            .catch(err => console.error('Errore SW:', err));
    }

});
</script>

</body>
</html>
