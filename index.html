<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <!-- 🔑 QUESTO È FONDAMENTALE -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
            <title>Calore 2.0</title>
            <link rel="preconnect" href="https://cdn.jsdelivr.net">
            
            <link rel="stylesheet" href="css/style.css">
            <link rel="stylesheet" href="css/modals.css">
            <link rel="apple-touch-icon" href="icons/caloriferi-512.png">
            <link rel="manifest" href="manifest.json">
            <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Caloriferi">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">

    </head>
<body>

<!-- ================= TOPBAR ================= -->

<header class="app-header">

    <div class="app-title">
        <span>🔥</span>
        <span>Calore</span>
    </div>

    <nav class="nav-icons">

    <a href="index.html" class="active" title="Dashboard">
        <i data-lucide="house"></i>
    </a>

    <a href="caloriferi.html" title="Caloriferi">
        <i data-lucide="flame"></i>
    </a>

    <a href="storico.html" title="Storico">
        <i data-lucide="history"></i>
    </a>

    <a href="grafici.html" title="Grafici">
        <i data-lucide="chart-column"></i>
    </a>

    <a href="ripartizione.html" title="Ripartizione">
        <i data-lucide="file-text"></i>
    </a>

    <a href="impostazioni.html" title="Impostazioni">
        <i data-lucide="settings"></i>
    </a>

</nav>

<!-- ================= CONTENUTO ================= -->

</header>

  <main class="container">
    
    <div class="card-anno">
        <span class="label">🔥 Anno termico</span>
        <span class="value" id="annoTermicoAttivo"></span>
    </div>

<!-- HEADER DASHBOARD -->

<div class="page-header">

    <div class="page-heading">

        <h1 class="page-title">
            <i data-lucide="house"></i>
            <span>Dashboard</span>
        </h1>

    </div>

    <div class="page-actions">

        <button class="btn-pill" onclick="apriLetturaSheet()">
            📝 Nuova lettura
        </button>

    </div>

    </div>

        <!-- CARDS TOTALI -->
    <div class="stats-grid">

        <!-- Consumo contabilizzato -->
    <div class="card card-total dashboard-consumo-card">

        <div class="card-header">
             <i data-lucide="clipboard-list"></i>
            <span>Consumo contabilizzato</span>
        </div>

        <div class="card-center">
            <div class="number" id="totaleConsumi">0</div>
        </div>

    </div>

    <!-- Caloriferi -->
    <div class="card card-small">

        <div class="card-header">
            <i data-lucide="flame"></i>
            <span>Caloriferi</span>
        </div>

        <div class="card-center">
            <div class="number" id="numeroCaloriferi">0</div>
        </div>

    </div>

    <!-- Letture -->
    <div class="card card-small">

        <div class="card-header">
            <i data-lucide="notebook-pen"></i>
            <span>Letture</span>
        </div>

        <div class="card-center">
            <div class="number" id="numeroLetture">0</div>
        </div>

    </div>

</div>

  <!-- CARD GRAFICO CONSUMI-->
   <div class="card chart-card">
    <div class="card-header">
    <i data-lucide="chart-column"></i>
    <span>Andamento Consumi</span>
</div>
    <canvas id="consumiChart"></canvas>
   </div>

  <!-- CARD CONSUMI PER STANZA -->
    <div class="card" id="consumiPerStanza">

    <div class="card-header">
        <i data-lucide="house"></i>
        <span>Consumi per stanza</span>
    </div>
</div>

</main>

<!-- OVERLAY NUOVA LETTURA -->
<div id="sheetOverlayLettura"
     class="sheet-overlay hidden"
     onclick="chiudiLetturaSheet()"></div>

  <!-- SHEET NUOVA LETTURA -->
  <div id="letturaSheet" class="sheet hidden">
  <div class="sheet-header">
    <h2>Nuova Lettura</h2>
    <button class="close-btn"
            onclick="chiudiLetturaSheet()">✕</button>
  </div>
  <div class="sheet-content">
    <label>Calorifero</label>
    <select id="letturaCalorifero"></select>

  <div class="ultima-lettura">

    <div class="ultima-title">
        Ultima lettura registrata
    </div>

    <div class="ultima-data" id="ultimaLetturaData">
        --
    </div>

    <div class="ultima-display">
        <span>📟 Display</span>
        <strong id="ultimaLetturaValore">--</strong>
    </div>

</div>

    <label>Valore</label>
    <input
       type="number" 
       id="letturaValore" 
       placeholder="Es: 123">

    <label>Data</label>
    <input type="date" id="letturaData">

    <div class="sheet-actions">

    <button class="btn-modal-secondary" onclick="chiudiLetturaSheet()">
        Annulla
    </button>

    <button class="btn-modal-primary" onclick="salvaLettura()">
        Registra
    </button>
    </div> <!-- sheet-actions -->

  </div> <!-- sheet-actions -->

</div> <!-- letturaSheet -->

<!-- JS -->
<script src="js/theme.js"></script>
<script src="js/version.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/modals.js"></script>
<script src="js/dashboard.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>


<script>
window.addEventListener("load", () => {

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker attivo su:', reg.scope))
            .catch(err => console.error('Errore SW:', err));
    }

});
</script>

</body>
</html>
